
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | FixIt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            max-width: 420px;
            margin: 70px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .login-wrapper h1 {
            margin-bottom: 10px;
        }

        .login-wrapper p {
            margin-bottom: 22px;
            color: #64748b;
        }

        .login-wrapper label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }

        .login-wrapper input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-wrapper button {
            width: 100%;
            margin-top: 22px;
            cursor: pointer;
        }

        .login-error {
            color: #b91c1c !important;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ url_for('home') }}" class="logo">FixIt</a>
        </header>

        <main class="login-wrapper">
            <h1>Staff Login</h1>
            <p>Sign in to manage campus complaints.</p>

            {% if error %}
                <p class="login-error" role="alert">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('staff_login') }}">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="btn">Sign In</button>
            </form>

            <a href="{{ url_for('home') }}" class="back-link">
                ← Back to Home
            </a>
        </main>
    </div>
</body>
</html>
